name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 連続 push 時は古いデプロイを待たずに新しい方だけ流す
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v5

      # cf は Bun ランタイム非対応(Node 22.18 以上が必要)。bun はパッケージ管理だけに使う
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # astro build を実行し、.cloudflare/output/v0 に Build Output を出力する
      - run: bunx cf build

      - run: bunx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
